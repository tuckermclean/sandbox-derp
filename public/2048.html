<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<style>
  :root {
    --bg: #faf8ef;
    --board: #bbada0;
    --cell-empty: #cdc1b4;
    --tile-text-dark: #776e65;
    --tile-text-light: #f9f6f2;
    --score-bg: #bbada0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .game {
    width: min(90vw, 440px);
    padding: 16px 0;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  h1 {
    margin: 0;
    font-size: 40px;
    color: var(--tile-text-dark);
  }
  .right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .score-box {
    background: var(--score-bg);
    color: #fff;
    border-radius: 6px;
    padding: 6px 14px;
    text-align: center;
    font-size: 14px;
    min-width: 72px;
  }
  .score-box .value {
    display: block;
    font-size: 22px;
    font-weight: bold;
    color: #fff;
  }
  button {
    background: #8f7a66;
    color: #f9f6f2;
    border: none;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: #9f8b77; }
  .board-wrap {
    position: relative;
    background: var(--board);
    border-radius: 8px;
    padding: 8px;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 8px;
    aspect-ratio: 1;
  }
  .cell {
    background: var(--cell-empty);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: bold;
    color: var(--tile-text-dark);
  }
  .cell[data-tile="2"], .cell[data-tile="4"] { color: var(--tile-text-dark); }
  .cell[data-tile="2"] { background: #eee4da; }
  .cell[data-tile="4"] { background: #ede0c8; }
  .cell[data-tile="8"] { background: #f2b179; color: var(--tile-text-light); }
  .cell[data-tile="16"] { background: #f59563; color: var(--tile-text-light); }
  .cell[data-tile="32"] { background: #f67c5f; color: var(--tile-text-light); }
  .cell[data-tile="64"] { background: #f65e3b; color: var(--tile-text-light); }
  .cell[data-tile="128"] { background: #edcf72; color: var(--tile-text-light); }
  .cell[data-tile="256"] { background: #edcc61; color: var(--tile-text-light); }
  .cell[data-tile="512"] { background: #edc850; color: var(--tile-text-light); }
  .cell[data-tile="1024"] { background: #edc53f; color: var(--tile-text-light); }
  .cell[data-tile="2048"] { background: #edc22e; color: var(--tile-text-light); }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(238, 228, 218, 0.73);
    border-radius: 8px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
  }
  .overlay.visible { display: flex; }
  .overlay .title {
    font-size: 44px;
    font-weight: bold;
    color: var(--tile-text-dark);
    margin: 0;
  }
  .hint {
    color: var(--tile-text-dark);
    font-size: 13px;
    text-align: center;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="game">
  <div class="header">
    <h1>2048</h1>
    <div class="right">
      <div class="score-box">Score<span class="value" id="score">0</span></div>
      <button id="new-game" type="button">New Game</button>
    </div>
  </div>
  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay">
      <p class="title" id="overlay-title">Game Over!</p>
      <button id="overlay-new" type="button">Try Again</button>
    </div>
  </div>
  <p class="hint">Use arrow keys to slide tiles. Match tiles to merge them — reach 2048!</p>
</div>

<script>
(function () {
  'use strict';

  var SIZE = 4;

  function slideWithScore(row) {
    var nz = row.filter(function (v) { return v !== 0; });
    var out = [];
    var gained = 0;
    for (var i = 0; i < nz.length; i++) {
      if (i + 1 < nz.length && nz[i] === nz[i + 1]) {
        out.push(nz[i] * 2);
        gained += nz[i] * 2;
        i++;
      } else {
        out.push(nz[i]);
      }
    }
    while (out.length < SIZE) out.push(0);
    return { row: out, gained: gained };
  }

  function slide(row) {
    return slideWithScore(row).row;
  }

  function clone(board) {
    return board.map(function (row) { return row.slice(); });
  }

  function move(board, dir) {
    var work = clone(board);
    var r, c, col, slid;

    if (dir === 'left') {
      work = work.map(function (row) { return slide(row.slice()); });
    } else if (dir === 'right') {
      work = work.map(function (row) { return slide(row.slice().reverse()).reverse(); });
    } else if (dir === 'up') {
      for (c = 0; c < SIZE; c++) {
        col = [];
        for (r = 0; r < SIZE; r++) col.push(board[r][c]);
        slid = slide(col);
        for (r = 0; r < SIZE; r++) work[r][c] = slid[r];
      }
    } else if (dir === 'down') {
      for (c = 0; c < SIZE; c++) {
        col = [];
        for (r = SIZE - 1; r >= 0; r--) col.push(board[r][c]);
        slid = slide(col);
        for (r = 0; r < SIZE; r++) work[SIZE - 1 - r][c] = slid[r];
      }
    }
    return work;
  }

  function gainedFor(board, dir) {
    var total = 0;
    var r, c, res;

    if (dir === 'left' || dir === 'right') {
      for (r = 0; r < SIZE; r++) {
        var row = board[r].slice();
        if (dir === 'right') row.reverse();
        res = slideWithScore(row);
        total += res.gained;
      }
    } else {
      for (c = 0; c < SIZE; c++) {
        var col = [];
        for (r = 0; r < SIZE; r++) col.push(board[r][c]);
        if (dir === 'down') col.reverse();
        res = slideWithScore(col);
        total += res.gained;
      }
    }
    return total;
  }

  function emptyBoard() {
    var b = [];
    for (var r = 0; r < SIZE; r++) {
      var row = [];
      for (var c = 0; c < SIZE; c++) row.push(0);
      b.push(row);
    }
    return b;
  }

  var board = emptyBoard();
  var score = 0;
  var won = false;

  function emptyCells() {
    var cells = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (board[r][c] === 0) cells.push({ r: r, c: c });
      }
    }
    return cells;
  }

  function spawnTile() {
    var cells = emptyCells();
    if (cells.length === 0) return false;
    var cell = cells[Math.floor(Math.random() * cells.length)];
    board[cell.r][cell.c] = Math.random() < 0.9 ? 2 : 4;
    return true;
  }

  function hasWon() {
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (board[r][c] === 2048) return true;
      }
    }
    return false;
  }

  function canMove() {
    if (emptyCells().length > 0) return true;
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var v = board[r][c];
        if (c + 1 < SIZE && board[r][c + 1] === v) return true;
        if (r + 1 < SIZE && board[r + 1][c] === v) return true;
      }
    }
    return false;
  }

  function render() {
    var boardEl = document.getElementById('board');
    boardEl.innerHTML = '';
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        var v = board[r][c];
        if (v !== 0) {
          cell.setAttribute('data-tile', String(v));
          cell.textContent = v;
        }
        boardEl.appendChild(cell);
      }
    }
    document.getElementById('score').textContent = String(score);
  }

  function showOverlay(title) {
    var overlay = document.getElementById('overlay');
    document.getElementById('overlay-title').textContent = title;
    overlay.classList.add('visible');
  }

  function handleMove(dir) {
    if (won) return;
    var overlay = document.getElementById('overlay');
    if (overlay.classList.contains('visible')) return;

    var moved = move(board, dir);
    var changed = false;

    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (moved[r][c] !== board[r][c]) changed = true;
      }
    }

    if (!changed) return;

    score += gainedFor(board, dir);
    board = moved;
    spawnTile();
    render();

    if (hasWon()) {
      won = true;
      showOverlay('You Win!');
    } else if (!canMove()) {
      showOverlay('Game Over!');
    }
  }

  function newGame() {
    board = emptyBoard();
    score = 0;
    won = false;
    spawnTile();
    spawnTile();
    document.getElementById('overlay').classList.remove('visible');
    render();
  }

  document.addEventListener('keydown', function (e) {
    var dir = null;
    if (e.key === 'ArrowUp') dir = 'up';
    else if (e.key === 'ArrowDown') dir = 'down';
    else if (e.key === 'ArrowLeft') dir = 'left';
    else if (e.key === 'ArrowRight') dir = 'right';
    if (dir) {
      e.preventDefault();
      handleMove(dir);
    }
  });

  document.getElementById('new-game').addEventListener('click', newGame);
  document.getElementById('overlay-new').addEventListener('click', newGame);

  newGame();
})();
</script>
</body>
</html>
